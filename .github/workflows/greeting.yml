name: Community Welcome Gate

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "👋 Welcome to **Nexus-Agent**! Thank you for opening an issue. Our engineering team will review it shortly. If you haven't yet, please consider giving us a ⭐ **Star** on GitHub to support open-source development!"
        pr-message: "🚀 Fantastic! Thank you for submitting your first PR to **Nexus-Agent**! We love community contributions. Please ensure all unit tests pass."
